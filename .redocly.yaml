extends:
  - recommended

rules:
  security-defined: off
  info-license-strict: off
  no-invalid-media-type-examples: off

theme:
  openapi:
    expandResponses: "all"
    showExtensions: true
    scrollYOffset: 64
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: JavaScript
        - lang: Python
        - lang: PHP

  typography:
    fontSize: '14px'
    lineHeight: 1.6
    fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
    headings:
      fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
      fontWeight: '600'
      lineHeight: 1.3
    code:
      fontSize: '12.5px'
      fontFamily: '"JetBrains Mono", "SFMono-Regular", Consolas, monospace'
      lineHeight: 1.5

  colors:
    primary:
      main: '#0969da'
    text:
      primary: '#1f2328'
      secondary: '#656d76'
    responses:
      success:
        color: '#1a7f37'
      error:
        color: '#cf222e'
      redirect:
        color: '#9a6700'
      info:
        color: '#0969da'
    http:
      get: '#1a7f37'
      post: '#0969da'
      put: '#9a6700'
      delete: '#cf222e'

  spacing:
    sectionHorizontal: 28
    sectionVertical: 24

  schema:
    linesColor: '#d0d7de'
    defaultDetailsWidth: '65%'
    typeNameColor: '#0969da'
    typeTitleColor: '#1f2328'