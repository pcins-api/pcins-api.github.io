extends:
  - recommended

rules:
  security-defined: off
  info-license-strict: off
  no-invalid-media-type-examples: off

theme:
  openapi:
    expandResponses: "all"
    showExtensions: true
    scrollYOffset: 64
    generateCodeSamples:
      languages:
        - lang: curl
        - lang: JavaScript
        - lang: Python
        - lang: PHP

  typography:
    fontSize: '14.5px'
    lineHeight: 1.6
    fontFamily: '"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
    headings:
      fontFamily: '"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
      fontWeight: '700'
      lineHeight: 1.3
    code:
      fontSize: '13px'
      fontFamily: '"JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace'
      lineHeight: 1.5

  colors:
    primary:
      main: '#3b82f6'
    text:
      primary: '#1e293b'
      secondary: '#64748b'
    responses:
      success:
        color: '#10b981'
      error:
        color: '#ef4444'
      redirect:
        color: '#f59e0b'
      info:
        color: '#3b82f6'
    http:
      get: '#10b981'
      post: '#3b82f6'
      put: '#f59e0b'
      delete: '#ef4444'

  spacing:
    sectionHorizontal: 28
    sectionVertical: 24

  schema:
    linesColor: '#e2e8f0'
    defaultDetailsWidth: '65%'
    typeNameColor: '#3b82f6'
    typeTitleColor: '#1e293b'