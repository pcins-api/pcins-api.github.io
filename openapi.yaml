components:
  securitySchemes:
    MerchantAuth:
      type: apiKey
      in: query
      name: merchantId
      description: "Merchant authentication via merchantId and merchantPwd query/body fields"

  schemas:
    # 1. Hosted UI Payment Requests
    CreditCardUIRequest:
      type: object
      required:
        - merchantId
        - ref
        - tradeGubun
        - currType
        - price
        - payEmail
        - payTel
        - productName
        - returnURL
        - callbackURL
      properties:
        merchantId:
          type: string
          description: "Merchant ID issued by PCINS (e.g. M000000187)"
          example: "M000000187"
        merchantPwd:
          type: string
          description: "Merchant Password (Conditional: Required if 3DS is configured)"
          example: "1234"
        ref:
          type: string
          description: "Unique Merchant Transaction Number (Order Number)"
          example: "ORD20240122001"
        tradeGubun:
          type: string
          enum: ["1"]
          description: "Transaction Type (1: Online Payment)"
          example: "1"
        currType:
          type: string
          enum: ["JPY", "USD", "EUR", "KRW", "CNY"]
          description: "Transaction Currency Code"
          example: "JPY"
        price:
          type: number
          description: "Payment Amount (JPY no decimal; USD/EUR/CNY max 2 decimals)"
          example: 2000
        payName:
