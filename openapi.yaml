              <input type="hidden" name="payName" value="John Doe">
              <input type="hidden" name="payId" value="customer123">
              <input type="hidden" name="productName" value="Premium Subscription">
              <input type="hidden" name="payEmail" value="john@example.com">
              <input type="hidden" name="payTel" value="090-1234-5678">
              <input type="hidden" name="callbackURL" value="https://your-site.com/callback">
              <input type="hidden" name="returnURL" value="https://your-site.com/return">
              <button type="submit">Proceed to 3DS Payment</button>
            </form>
        - lang: JavaScript
          label: JavaScript (Fetch)
          source: |
            const payload = new URLSearchParams({
              merchantId: 'M000000413',
              merchantPwd: '1234',
              ref: 'ORD3DS20240122',
              tradeGubun: '1',
              currType: 'JPY',
              cardType: 'VIS',
              price: '5000',
              payName: 'John Doe',
              payId: 'customer123',
              productName: 'Premium Subscription',
              payEmail: 'john@example.com',
              payTel: '090-1234-5678',
              callbackURL: 'https://your-site.com/callback',
              returnURL: 'https://your-site.com/return'
            });

            const res = await fetch('https://pay.pcins.co.kr/gw/pay_external.jsp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: payload.toString()
            });
            console.log(await res.text());
        - lang: Python
          label: Python (requests)
          source: |
            import requests

            data = {
                'merchantId': 'M000000413',
                'merchantPwd': '1234',
                'ref': 'ORD3DS20240122',
                'tradeGubun': '1',
                'currType': 'JPY',
                'cardType': 'VIS',
                'price': '5000',
                'payName': 'John Doe',
                'payId': 'customer123',
