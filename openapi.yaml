    ## 🌐 Base URLs, Security & Test Accounts
    - **Production Base URL**: `https://pay.pcins.co.kr/gw`
    - **Callback Security**: Callback server security allows connections **only from IP `61.74.60.18` and `61.74.60.19`** (Method: `POST`).

    ### 🧪 Test Account Environment
    | Authentication Mode | `merchantId` | `merchantPwd` | Notes |
    | :--- | :--- | :--- | :--- |
    | **NON-3DS (General)** | `M000000187` | `1234` | Standard test merchant account |
    | **3DS (3D Secure)** | `M000000413` | `1234` | 3D Secure authentication test account |

    ---

    ## 📐 Data Format Principles
    1. **Currency Amounts**:
       - **JPY** amounts do not permit decimal points.
       - **USD, EUR, CNY** amounts allow up to two decimal places (e.g., `19.99`).
    2. **Card Expiration Date**:
       - **expireM** (Month): Format `MM` (2 digits). Numbers under 10 must have a leading zero (`01`, `02`, ..., `12`).
       - **expireY** (Year): Format `YY` (2 digits). Numbers under 10 must have a leading zero (`25`, `26`).
    3. **Identifier Fields**:
       - **payId**: Only letters and numbers (`a-zA-Z0-9`) are permitted.
       - **transTime**: Format `YYYYMMDDHHMMSS` (14 numeric digits).

    ---

    ## ⚙️ Common Parameter Enums

    ### 1. Message Stage (`erst`)
    | Value | Definition | Description |
    | :--- | :--- | :--- |
    | `logon` | Logon Stage | Initial connection authentication stage |
    | `aures` | Confirmation Stage | Authorization / Response verification stage |
    | `logoff` | Logoff Stage | Disconnection stage |

    ### 2. Transaction Type (`tradeGubun`)
    | Value | Definition | Relevant Endpoints |
    | :---: | :--- | :--- |
    | `1` | Sale (Online Approval / Payment) | `/pay_link.jsp`, `/pay_external.jsp`, `/pay_direct3ds.jsp`, `/qr_link.jsp`, `/pay_request.jsp` |
    | `2` | Refund (Payment Cancellation) | `/pay_request.jsp` |
    | `7` | Confirmation (Card Verification) | `/pay_link.jsp` |
    | `9` | Transaction Inquiry | `/pay_request.jsp` |
    | `11` | Register Recurring Billing | Continuous billing registration |
    | `12` | Cancel Recurring Billing | Continuous billing cancellation |

    ### 3. Currency Code (`currType`)
    | Code | Currency Name | Decimal Allowed |
    | :---: | :--- | :---: |
    | `JPY` | Japanese Yen | ❌ No |
    | `USD` | US Dollar | ✔️ Yes (max 2) |
    | `EUR` | Euro | ✔️ Yes (max 2) |
    | `KRW` | Korean Won | ❌ No |
    | `CNY` | Chinese Yuan | ✔️ Yes (max 2) |

    ### 4. Card Brand Type (`cardType`)
    | Code | Brand Name |
    | :---: | :--- |
    | `AMX` | American Express |
    | `JCB` | Japanese Credit Bank |
    | `MSC` | MasterCard |
    | `VIS` | VISA |

    ### 5. Special Card Number for Speed Payment (`cardNo`)
    | Value | Search Criteria |
    | :--- | :--- |
    | `88888888888888` | Search for stored card info by `merchantId` + phone number (`payTel`) + `payId` |
    | `88888888888881` | Search for stored card info by `merchantId` + phone number (`payTel`) |
    | `88888888888882` | Search for stored card info by `merchantId` + `payId` |

    ### 6. Character Encoding & Language (`charset`, `lang`)
    | Attribute | Value | Description |
    | :--- | :--- | :--- |
    | **`charset`** | `UTF-8` | Global standard (Default) |
    | | `SHIFT-JIS` | Japanese legacy |
    | | `EUC-KR` | Korean legacy |
    | **`lang`** | `JP` | Japanese |
    | | `EN` | English |
    | | `CN` | Chinese |

    ### 7. Transaction Result Status Codes
    | Field | Value | Definition |
    | :--- | :---: | :--- |
    | **`transCode`** (Approval Status) | `AS` | Authorization Success |
    | | `AF` | Authorization Failed |
    | **`transStaus`** (Inquiry Status) | `1` | Sale Completed |
    | | `2` | Refund Completed |

    ---

