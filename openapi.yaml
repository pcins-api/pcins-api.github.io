    ## 🔤 Abbreviations and Symbols
    | Symbol | Definition | Description |
    | :---: | :--- | :--- |
    | `<` | Variable length | Variable length data that can be entered up to the written value |
    | `a` | Alphanumeric | Letter or number such as alphabet |
    | `C` | Conditional required | Field required only when specific conditions are met |
    | `dp` | Decimal point | Decimal point notation permitted |
    | `h` | Hexadecimal | Hexadecimal character data |
    | `M` | Required | Mandatory field (must always be included) |
    | `n` | Number | Numeric character digits |
    | `O` | Optional | Optional field |
    | `V` | Variable | Variable length data with no explicit upper limit |

    ---

    ## 📋 Master Field Table (No 1 ~ No 48)
    | No | Field Name | Field Description | Size (byte) | Type | Condition |
    | :---: | :--- | :--- | :---: | :---: | :---: |
    | 1 | `?` | Request Start | 1 | a | M |
    | 2 | `erst` | Message Stage (logon, aures, logoff) | 3 | a | O |
    | 3 | `ver` | Interface Version ("100") | 3 | n | M |
    | 4 | `merchantId` | Merchant ID | 10 | a | M |
