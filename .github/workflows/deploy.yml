name: Deploy API Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'openapi.yaml'
      - 'index.html'
      - 'template.hbs'
      - '.redocly.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'pcins_image.png'
      - 'pcins_logo.png'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run lint

      - name: Build documentation
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
