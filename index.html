<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <title>PCINS Payment Gateway API Documentation</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PCINS Payment Gateway API Documentation - Developer Integration Guide." />
  <link rel="icon" href="pcins_logo.png" type="image/png" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. Developer-Friendly Engineering Design System (GitHub Docs & Stripe Style)
       ========================================================================== */
    :root {
      /* Primary Brand & Accents */
      --primary: #0969da;
      --primary-hover: #0854b0;
      --primary-light: #ddf4ff;
      --primary-border: #54aeff;
      
      /* Status Colors */
      --success: #1a7f37;
      --success-bg: #dafbe1;
      --success-border: #8de49e;
      --error: #cf222e;
      --error-bg: #ffebe9;
      --error-border: #ff8182;
      
      /* Surfaces & Layout (Clean Technical White & Neutral Grey) */
      --bg-body: #ffffff;
      --bg-sidebar: #f6f8fa;
      --bg-header: rgba(255, 255, 255, 0.9);
      --bg-card: #ffffff;
      --bg-card-hover: #f3f4f6;
      --bg-modal: #ffffff;
      --bg-code: #0d1117;
      
      /* Typography (Precise Technical Neutral) */
      --text-main: #1f2328;
      --text-muted: #656d76;
      --text-dim: #8c959f;
      
      /* Borders & Dividers (Subtle 1px Lines) */
      --border-color: #d0d7de;
      --border-subtle: #eaeef2;
      --border-strong: #afb8c1;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.04);
      --shadow-md: 0 3px 6px rgba(140, 149, 159, 0.15);
      --shadow-modal: 0 8px 24px rgba(140, 149, 159, 0.2);
    }

    [data-theme="dark"] {
      /* Primary Brand & Accents */
      --primary: #2f81f7;
      --primary-hover: #58a6ff;
      --primary-light: rgba(56, 139, 253, 0.15);
      --primary-border: rgba(56, 139, 253, 0.4);
      
      /* Status Colors */
      --success: #3fb950;
      --success-bg: rgba(46, 160, 67, 0.15);
      --success-border: rgba(63, 185, 80, 0.4);
      --error: #f85149;
      --error-bg: rgba(248, 81, 73, 0.15);
      --error-border: rgba(248, 81, 73, 0.4);
      
      /* Surfaces & Layout (True Developer Dark - GitHub & Vercel) */
      --bg-body: #0d1117;
      --bg-sidebar: #010409;
      --bg-header: rgba(13, 17, 23, 0.9);
      --bg-card: #161b22;
      --bg-card-hover: #21262d;
      --bg-modal: #161b22;
      --bg-code: #010409;
      
      /* Typography */
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      
      /* Borders & Dividers */
      --border-color: #30363d;
      --border-subtle: #21262d;
      --border-strong: #484f58;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(1, 4, 9, 0.5);
      --shadow-modal: 0 12px 32px rgba(1, 4, 9, 0.8);
    }

    /* ==========================================================================
       2. Global Reset & Engineering Typography
       ========================================================================== */
    * {
      box-sizing: border-box;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.1s ease;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    /* Top Progress Bar (Subtle Monochromatic Blue) */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--primary);
      width: 0%;
      z-index: 10000;
      transition: width 0.08s ease;
    }

    /* ==========================================================================
       3. Header & Navigation (Clean Precision Engineering)
       ========================================================================== */
    .pcins-top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 56px;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .pcins-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      white-space: nowrap;
    }

    .pcins-logo-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
      border-radius: 4px;
    }

    .pcins-brand-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .pcins-version-tag {
      background: var(--bg-card-hover);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    .pcins-spec-tag {
      background: var(--success-bg);
      color: var(--success);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--success-border);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }

    .pcins-nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    /* Test Account Copy Badges (IDE Tag Style) */
    .pcins-account-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pcins-account-badge:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .pcins-account-badge .badge-label {
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    .pcins-account-badge .copy-icon {
      opacity: 0.5;
      display: inline-flex;
      align-items: center;
    }
    .pcins-account-badge:hover .copy-icon {
      opacity: 1;
    }

    /* Action Buttons (Compact Tooling) */
    .pcins-action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pcins-action-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .pcins-action-btn kbd {
      background: var(--bg-card-hover);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      box-shadow: inset 0 -1px 0 var(--border-color);
      font-family: 'JetBrains Mono', monospace;
    }

    .pcins-theme-toggle {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pcins-theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    /* ==========================================================================
       4. Redoc UI Overrides (Clean Engineering 3-Column Layout)
       ========================================================================== */
    .redoc-wrap {
      font-family: 'Inter', sans-serif !important;
      background-color: var(--bg-body) !important;
    }

    /* Column 1: Left Navigation Sidebar */
    [role="navigation"] {
      width: 280px !important;
      min-width: 280px !important;
      background-color: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border-color) !important;
    }

    [role="navigation"] input.search-input {
      background-color: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      font-size: 13px !important;
      padding: 7px 12px 7px 32px !important;
    }

    [role="navigation"] label {
      color: var(--text-muted) !important;
      font-weight: 500 !important;
      font-size: 13px !important;
      word-break: keep-all !important;
      line-height: 1.35 !important;
    }

    [role="navigation"] li.active > label,
    [role="navigation"] li.active > a {
      color: var(--primary) !important;
      background-color: var(--primary-light) !important;
      font-weight: 600 !important;
    }

    /* Column 2: Main Documentation Content Area */
    .api-content {
      background-color: var(--bg-body) !important;
      max-width: none !important;
    }

    /* Banner Image Styling in Top Section */
    .api-content img[src*="pcins_image.png"] {
      max-width: 240px !important;
      height: auto !important;
      margin-bottom: 20px !important;
      display: block !important;
      border-radius: 4px !important;
    }

    [data-theme="dark"] .api-content img[src*="pcins_image.png"] {
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 12px;
      border-radius: 6px;
    }

    .api-content h1, 
    .api-content h2, 
    .api-content h3, 
    .api-content h4 {
      color: var(--text-main) !important;
      font-weight: 600 !important;
      letter-spacing: -0.015em !important;
      word-break: keep-all !important;
    }

    .api-content p,
    .api-content li {
      color: var(--text-main) !important;
      line-height: 1.6 !important;
      word-break: keep-all !important;
    }

    /* Column 3: Right Side Code Block Panel */
    .redoc-wrap [role="region"],
    div[class*="sc-iqzjCY"],
    div[class*="sc-kUNMIZ"] {
      background-color: var(--bg-code) !important;
    }

    /* --- Clean Table Readability --- */
    table {
      width: 100% !important;
      border-collapse: collapse !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      overflow: hidden !important;
      background-color: var(--bg-card) !important;
      margin: 16px 0 !important;
    }

    th {
      background-color: var(--bg-sidebar) !important;
      color: var(--text-main) !important;
      border-bottom: 1px solid var(--border-color) !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      white-space: nowrap !important;
      word-break: keep-all !important;
    }

    td {
      border-bottom: 1px solid var(--border-color) !important;
      padding: 8px 12px !important;
      font-size: 13px !important;
      line-height: 1.5 !important;
      vertical-align: middle !important;
    }

    td:first-child,
    td:nth-child(2) {
      word-break: keep-all !important;
    }

    table code {
      white-space: nowrap !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12px !important;
      padding: 2px 5px !important;
      border-radius: 4px !important;
      background-color: var(--bg-card-hover) !important;
      border: 1px solid var(--border-color) !important;
    }

    /* Schema Parameter Table: 1-Line Clean Alignment */
    td[kind="field"] {
      white-space: nowrap !important;
      min-width: 160px !important;
    }

    td[kind="field"] > div,
    td[kind="field"] .property-name {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      white-space: nowrap !important;
    }

    /* Required Badge inside schema tables */
    td[kind="field"] div[class*="required"],
    td[kind="field"] span[class*="required"] {
      display: inline-block !important;
      font-size: 10px !important;
      font-weight: 600 !important;
      padding: 1px 5px !important;
      border-radius: 3px !important;
      margin-left: 6px !important;
      margin-top: 0 !important;
      vertical-align: middle !important;
      white-space: nowrap !important;
      background-color: var(--error-bg) !important;
      color: var(--error) !important;
      border: 1px solid var(--error-border) !important;
    }

    /* Schema Type & Format Labels */
    td span[class*="hhCpbw"],
    td span[class*="fIGxvH"],
    td div > span {
      white-space: nowrap !important;
    }

    /* Copy Button in Code Blocks */
    div[class*="sc-gjLKRm"] button {
      border-radius: 4px !important;
      font-size: 11.5px !important;
      font-weight: 500 !important;
      font-family: 'JetBrains Mono', monospace !important;
    }

    /* ==========================================================================
       5. Result Code Finder Modal (Raycast / Command Palette Style)
       ========================================================================== */
    .pcins-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(1, 4, 9, 0.6);
      backdrop-filter: blur(6px);
      z-index: 100000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease;
    }

    .pcins-modal-backdrop.active {
      display: flex;
    }

    .pcins-modal {
      background: var(--bg-modal);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 640px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      animation: slideUp 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pcins-modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
    }

    .pcins-modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .pcins-modal-close {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .pcins-modal-close:hover {
      color: var(--text-main);
      background: var(--bg-card-hover);
    }

    .pcins-search-bar {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-sidebar);
    }

    .pcins-search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }

    .pcins-search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .pcins-code-list {
      padding: 10px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
    }

    .pcins-code-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .pcins-code-item:hover {
      border-color: var(--primary-border);
      background: var(--bg-card-hover);
    }

    .pcins-code-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pcins-code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      white-space: nowrap;
    }

    .pcins-code-badge.success {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .pcins-code-badge.error {
      background: var(--error-bg);
      color: var(--error);
      border-color: var(--error-border);
    }

    .pcins-code-desc {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
    }

    .pcins-code-details {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      word-break: keep-all;
    }

    /* Scroll To Top Button */
    .pcins-scroll-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      transition: all 0.15s ease;
    }

    .pcins-scroll-top:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    /* Toast Notification */
    .pcins-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-code);
      color: #f0f6fc;
      font-size: 12.5px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      z-index: 100001;
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .pcins-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 900px) {
      .pcins-account-badge {
        display: none;
      }
      .pcins-top-bar {
        padding: 0 14px;
      }
      [role="navigation"] {
        width: 100% !important;
      }
    }
  </style>
</head>

<body>
  <!-- Top Progress Indicator -->
  <div id="scroll-progress"></div>

  <!-- Top Global Header -->
  <header class="pcins-top-bar">
    <a href="#" class="pcins-brand">
      <img src="pcins_logo.png" alt="PCINS Logo" class="pcins-logo-icon" />
      <div class="pcins-brand-title">PCINS Gateway API</div>
      <span class="pcins-version-tag">v1.0.5</span>
      <span class="pcins-spec-tag">OpenAPI 3.0</span>
    </a>

    <div class="pcins-nav-links">
      <!-- Test Account 1: Non-3DS -->
      <div class="pcins-account-badge" onclick="copyText('M000000187', 'Copied NON-3DS Merchant ID (M000000187)')" title="Click to copy NON-3DS Test ID">
        <span class="badge-label">NON-3DS:</span> M000000187 
        <span class="copy-icon">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </span>
      </div>

      <!-- Test Account 2: 3DS -->
      <div class="pcins-account-badge" onclick="copyText('M000000413', 'Copied 3DS Merchant ID (M000000413)')" title="Click to copy 3DS Test ID">
        <span class="badge-label">3DS:</span> M000000413 
        <span class="copy-icon">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </span>
      </div>

      <!-- Quick Result Code Search Button -->
      <button class="pcins-action-btn" onclick="openResultCodeModal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Result Code</span>
        <kbd>Ctrl+K</kbd>
      </button>

      <!-- Theme Switcher -->
      <button class="pcins-theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light / Dark Mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <!-- Redoc Application Container -->
  <div id="redoc-container"></div>

  <!-- Result Code Command Palette Modal -->
  <div class="pcins-modal-backdrop" id="result-code-modal" onclick="closeResultCodeModal(event)">
    <div class="pcins-modal" onclick="event.stopPropagation()">
      <div class="pcins-modal-header">
        <div class="pcins-modal-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          <span>Result Code & Error Cause Finder</span>
        </div>
        <button class="pcins-modal-close" onclick="closeResultCodeModal()">&times;</button>
      </div>
      <div class="pcins-search-bar">
        <input 
          type="text" 
          id="code-search-input" 
          class="pcins-search-input" 
          placeholder="Type error code (e.g. 916, 927) or keywords..." 
          oninput="filterResultCodes()" 
          autocomplete="off"
        />
      </div>
      <div class="pcins-code-list" id="modal-code-list">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Scroll To Top Button -->
  <button class="pcins-scroll-top" id="scroll-top-btn" onclick="scrollToTop()" title="Scroll to Top">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <!-- Toast Notification Container -->
  <div class="pcins-toast" id="pcins-toast">
    <span id="toast-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <span id="toast-message">Copied to clipboard</span>
  </div>

  <!-- Redocly Standalone Script -->
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>

  <script>
    // Result Code Master Dataset
    const resultCodes = [
      { code: '000', type: 'success', summary: 'Approval Success', details: 'Payment / Cancellation / Authentication approval succeeded.' },
      { code: '101', type: 'error', summary: 'Failed to enter continuous billing information', details: 'Failed to register continuous billing (recurring payment) information.' },
      { code: '200', type: 'success', summary: 'Request Connection / Mail sent successfully', details: 'Connection request succeeded / Mail sent successfully.' },
      { code: '611', type: 'error', summary: 'Your card exceeds the monthly limit. Contact your administrator.', details: 'Monthly card credit limit exceeded. Please contact your card issuer or administrator.' },
      { code: '612', type: 'error', summary: 'Your card exceeds the number of times you use it per month. Contact your administrator.', details: 'Monthly card transaction frequency exceeded. Please contact your administrator.' },
      { code: '711', type: 'error', summary: 'This card BIN cannot be used.', details: 'Card BIN cannot be used with this payment service.' },
      { code: '712', type: 'error', summary: 'Korean card payment is not possible', details: 'Korean domestic card payment is not supported on this international payment line.' },
      { code: '713', type: 'error', summary: 'Risk card registration card, please try again with another card.', details: 'High-risk / flagged card detected (reported stolen/lost or suspected fraud). Please use another card.' },
      { code: '900', type: 'error', summary: 'The message is not long enough.', details: 'Transaction message packet length is insufficient or corrupted.' },
      { code: '901', type: 'error', summary: 'Connection Error. (VAN login failed / Invalid response data)', details: 'VAN login/authentication failed or invalid response data received.' },
      { code: '902', type: 'error', summary: 'VAN approval failure (Currency mismatch)', details: 'Requested payment currency does not match merchant configured currency (VAN route supports single currency).' },
      { code: '909', type: 'error', summary: 'Payment has already been made.', details: 'Duplicate transaction - payment has already been processed for this order number.' },
      { code: '910', type: 'error', summary: 'This card number is registered to the risk transaction card. Payment is not possible.', details: 'Card number registered in risk/fraud transaction monitoring database. Payment rejected.' },
      { code: '911', type: 'error', summary: 'The one-time payment limit has been exceeded. Please contact the administrator.', details: 'One-time transaction amount limit exceeded. Please contact administrator.' },
      { code: '912', type: 'error', summary: 'The daily payment limit has been exceeded. Please contact the administrator.', details: 'Daily transaction amount limit exceeded. Please contact administrator.' },
      { code: '913', type: 'error', summary: 'The one-month payment limit has been exceeded. Please contact the administrator.', details: 'Monthly transaction amount limit exceeded. Please contact administrator.' },
      { code: '914', type: 'error', summary: 'The password does not match.', details: 'Merchant password (merchantPwd) does not match.' },
      { code: '915', type: 'error', summary: 'Merchant Agreement is not Live.', details: 'Merchant agreement status is inactive (Live status required to process payments).' },
      { code: '916', type: 'error', summary: 'Requirements not entered* (Missing mandatory parameter)', details: 'Mandatory parameter missing (e.g., merchantId, cardNo, expireM, expireY, price, ref).' },
      { code: '917', type: 'error', summary: 'Transaction information does not exist.', details: 'Transaction information does not exist (please verify order ref or transNo).' },
      { code: '918', type: 'error', summary: 'Internet access is restricted. Please contact the administrator.', details: 'Internet/IP access restricted or unauthorized connection attempt.' },
      { code: '919', type: 'error', summary: 'There is no payment information.', details: 'No payment transaction record found.' },
      { code: '920', type: 'error', summary: 'Exceeded limit', details: 'Cardholder credit limit exceeded.' },
      { code: '921', type: 'error', summary: 'Insufficient balance', details: 'Insufficient account balance.' },
      { code: '922', type: 'error', summary: 'Incorrect card holder', details: 'Cardholder name does not match issuer records.' },
      { code: '923', type: 'error', summary: 'Incorrect card number', details: 'Invalid card number or checksum failed.' },
      { code: '924', type: 'error', summary: 'Incorrect expiration date', details: 'Invalid card expiration date (MM/YY).' },
      { code: '925', type: 'error', summary: 'Incorrect security code', details: 'Incorrect security code (CVV/CVC).' },
      { code: '926', type: 'error', summary: 'System error', details: 'Internal system processing error.' },
      { code: '927', type: 'error', summary: 'Card company approval rejected', details: 'Card company declined transaction approval (stolen/suspended/limit).' },
      { code: '928', type: 'error', summary: 'Invalid card type', details: 'Unsupported card brand or card type.' },
      { code: '929', type: 'error', summary: 'Stolen card', details: 'Reported stolen or lost card.' },
      { code: '931', type: 'error', summary: 'Please contact the card company.', details: 'Transaction rejected by issuer. Please contact issuing bank directly.' },
      { code: '932', type: 'error', summary: 'Please enter the security code (CVV).', details: 'Security code (CVV) parameter is required.' },
      { code: '933', type: 'error', summary: 'Incorrect card type.', details: 'Incorrect card brand or type selected.' },
      { code: '934', type: 'error', summary: 'This card is not eligible for the service.', details: 'Card is not eligible for this payment service.' },
      { code: '935', type: 'error', summary: 'Acquirer decline.', details: 'Payment acquirer declined transaction.' },
      { code: '936', type: 'error', summary: 'The minimum payment amount has not been met.', details: 'Payment amount is below minimum allowed threshold (check Yen / USD minimums).' },
      { code: '941', type: 'error', summary: 'This payment has already been refunded.', details: 'Payment transaction has already been refunded or refund is currently in progress.' },
      { code: '999', type: 'error', summary: 'Continuous charging has already been canceled.', details: 'Continuous charging (recurring billing) subscription is already cancelled.' }
    ];

    // Theme Management
    function initTheme() {
      try {
        const savedTheme = localStorage.getItem('pcins_theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);
      } catch (e) {
        setTheme('light');
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try {
        localStorage.setItem('pcins_theme', theme);
      } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        if (theme === 'dark') {
          btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
        } else {
          btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
        }
      }
    }

    // Scroll Progress & Scroll to Top
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      const bar = document.getElementById('scroll-progress');
      if (bar) bar.style.width = scrolled + '%';

      const topBtn = document.getElementById('scroll-top-btn');
      if (topBtn) {
        topBtn.style.display = winScroll > 300 ? 'flex' : 'none';
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById('pcins-toast');
      const msg = document.getElementById('toast-message');
      if (toast && msg) {
        msg.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }
    }

    // Robust Clipboard Copy
    function copyText(text, successMsg = 'Copied to clipboard') {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg);
        }).catch(() => {
          fallbackCopyText(text, successMsg);
        });
      } else {
        fallbackCopyText(text, successMsg);
      }
    }

    function fallbackCopyText(text, successMsg) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
          showToast(successMsg);
        }
      } catch (err) {
        console.error('Fallback copy failed: ', err);
      }
    }

    // Result Code Modal
    function openResultCodeModal() {
      const modal = document.getElementById('result-code-modal');
      const input = document.getElementById('code-search-input');
      if (modal) {
        modal.classList.add('active');
        renderResultCodes(resultCodes);
        if (input) {
          input.value = '';
          setTimeout(() => input.focus(), 100);
        }
      }
    }

    function closeResultCodeModal(e) {
      const modal = document.getElementById('result-code-modal');
      if (modal) modal.classList.remove('active');
    }

    function renderResultCodes(list) {
      const container = document.getElementById('modal-code-list');
      if (!container) return;
      
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 24px; color: var(--text-muted); font-size: 13px;">No matching result codes found.</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="pcins-code-item" onclick="copyText('${item.code}', 'Copied Error Code [${item.code}]')">
          <div class="pcins-code-item-header">
            <span class="pcins-code-badge ${item.type}">${item.code}</span>
            <span style="font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 4px;">
              Copy
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </span>
          </div>
          <div class="pcins-code-desc">${item.summary}</div>
          <div class="pcins-code-details">${item.details}</div>
        </div>
      `).join('');
    }

    function filterResultCodes() {
      const input = document.getElementById('code-search-input');
      const query = input ? input.value.toLowerCase().trim() : '';
      const filtered = resultCodes.filter(item => 
        item.code.toLowerCase().includes(query) ||
        item.summary.toLowerCase().includes(query) ||
        item.details.toLowerCase().includes(query)
      );
      renderResultCodes(filtered);
    }

    // Global Keydown Handler (Ctrl+K, ESC)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openResultCodeModal();
      } else if (e.key === 'Escape') {
        closeResultCodeModal();
      }
    });

    // Initialize Redoc
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      if (typeof Redoc !== 'undefined') {
        Redoc.init(
          'openapi.yaml',
          {
            scrollYOffset: 56,
            hideDownloadButton: false,
            disableSearch: false,
            expandResponses: "all",
            showExtensions: true,
            theme: {
              colors: {
                primary: { main: '#0969da' },
                text: {
                  primary: '#1f2328',
                  secondary: '#656d76'
                }
              },
              typography: {
                fontSize: '14px',
                lineHeight: '1.6',
                fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                headings: {
                  fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                  fontWeight: '600'
                },
                code: {
                  fontFamily: '"JetBrains Mono", "SFMono-Regular", Consolas, monospace',
                  fontSize: '12.5px'
                }
              }
            }
          },
          document.getElementById('redoc-container')
        );
      }
    });
  </script>
</body>

</html>
